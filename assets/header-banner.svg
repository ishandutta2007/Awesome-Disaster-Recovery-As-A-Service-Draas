<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Glassmorphism Card Overlay for Text Protection -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.9"/>
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #38bdf8;
      }
      .tagline {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: #94a3b8;
      }
      
      /* Dynamic Animations */
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.05); opacity: 0.7; }
        100% { transform: scale(0.95); opacity: 0.3; }
      }
      @keyframes rotate-grid {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dash-flow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-pill {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse-node {
        0%, 100% { fill: #00f2fe; r: 4; }
        50% { fill: #38bdf8; r: 7; filter: drop-shadow(0 0 6px #00f2fe); }
      }

      .animated-ring {
        transform-origin: 1050px 180px;
        animation: pulse-ring 6s ease-in-out infinite;
      }
      .animated-flow {
        stroke-dasharray: 8, 8;
        animation: dash-flow 3s linear infinite;
      }
      .floating-card-1 {
        animation: float-pill 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: float-pill 6s ease-in-out infinite 1.5s;
      }
      .node-1 { animation: pulse-node 3s infinite 0s; }
      .node-2 { animation: pulse-node 3s infinite 1s; }
      .node-3 { animation: pulse-node 3s infinite 2s; }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)" />

  <!-- Background Tech Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Dynamic / Animated Background Graphics (Positioned on RHS and Outer edges to keep title crystal clear) -->
  
  <!-- Glowing Rings & Nodes (RHS Background) -->
  <g class="animated-ring">
    <circle cx="1050" cy="180" r="140" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="1050" cy="180" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4, 4" stroke-opacity="0.4" />
  </g>

  <!-- DR Connection Flow Lines (Background dynamics) -->
  <g stroke="#00f2fe" stroke-width="2" opacity="0.4" fill="none">
    <!-- Primary to Secondary Replication Vector -->
    <path d="M 750 90 Q 900 40 1050 90 T 1150 180" class="animated-flow" />
    <path d="M 750 270 Q 900 320 1050 270 T 1150 180" class="animated-flow" />
  </g>

  <!-- Dynamic Floating Cards / Metrics (RHS Only - Away from Main Text Foreground) -->
  <g class="floating-card-1" transform="translate(820, 70)">
    <rect width="180" height="60" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
    <rect width="180" height="60" rx="10" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="25" cy="30" r="12" fill="#0284c7" fill-opacity="0.3" />
    <path d="M 20 30 L 24 34 L 31 25" stroke="#00f2fe" stroke-width="2" fill="none" />
    <text x="48" y="27" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">RPO TARGET</text>
    <text x="48" y="45" font-family="sans-serif" font-size="16" fill="#38bdf8" font-weight="700">&lt; 5 Seconds</text>
  </g>

  <g class="floating-card-2" transform="translate(860, 220)">
    <rect width="190" height="60" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" />
    <rect width="190" height="60" rx="10" fill="none" stroke="#4facfe" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="25" cy="30" r="12" fill="#0369a1" fill-opacity="0.3" />
    <!-- Sync Icon -->
    <path d="M 20 30 A 5 5 0 0 1 29 27 M 30 30 A 5 5 0 0 1 21 33" stroke="#38bdf8" stroke-width="2" fill="none" />
    <text x="48" y="27" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">AUTOMATED DR</text>
    <text x="48" y="45" font-family="sans-serif" font-size="16" fill="#4ade80" font-weight="700">Continuous Sync</text>
  </g>

  <!-- Interactive / Dynamic Nodes -->
  <circle cx="750" cy="90" class="node-1" />
  <circle cx="1050" cy="90" class="node-2" />
  <circle cx="1050" cy="270" class="node-3" />

  <!-- FOREGROUND TEXT PROTECTIVE CONTAINER (Glassmorphism backdrop for pristine readability) -->
  <rect x="50" y="45" width="670" height="270" rx="16" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="50" y="45" width="670" height="270" rx="16" fill="none" stroke="url(#cyan-glow)" stroke-width="1" opacity="0.6" />

  <!-- Left Accent Shield Icon -->
  <g transform="translate(80, 75)" filter="url(#subtle-glow)">
    <!-- Outer Shield Frame -->
    <path d="M 30 5 L 55 15 V 38 C 55 53 30 65 30 65 C 30 65 5 53 5 38 V 15 L 30 5 Z" fill="url(#shield-grad)" opacity="0.2" />
    <path d="M 30 5 L 55 15 V 38 C 55 53 30 65 30 65 C 30 65 5 53 5 38 V 15 L 30 5 Z" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <!-- Inner Check/Sync -->
    <path d="M 20 33 L 27 40 L 42 23" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Headline & Subtitles (Strictly foreground layer) -->
  <g filter="url(#shadow)">
    <!-- Header Badge -->
    <rect x="150" y="77" width="165" height="24" rx="12" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="162" y="93" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="80" y="150" class="title">Awesome DRaaS</text>
    
    <!-- Subtitle -->
    <text x="80" y="190" class="subtitle">Disaster Recovery as a Service</text>

    <!-- Detailed Tagline / Description -->
    <text x="80" y="235" class="tagline">SaaS Platforms &amp; Open-Source DR Orchestration Tools</text>
    <text x="80" y="260" class="tagline">Continuous Replication • Ransomware Recovery • Automated Cloud Failover</text>
  </g>

  <!-- Bottom Decorative Accent Line -->
  <rect x="80" y="285" width="610" height="2" fill="url(#cyan-glow)" rx="1" />
</svg>
